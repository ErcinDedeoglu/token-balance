name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cmake (BoringSSL / wreq)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev ;;
            macOS) brew install cmake ;;
            Windows) choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y ;;
          esac
      - name: Test
        run: cargo test -p token-balance --locked
      - name: Build
        run: cargo build -p token-balance --locked
