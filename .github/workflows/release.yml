name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: cmake (BoringSSL / wreq)
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) sudo apt-get update && sudo apt-get install -y cmake pkg-config clang libclang-dev ;;
            macOS) brew install cmake ;;
            Windows) choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y ;;
          esac
      - name: Build
        run: cargo build -p token-balance --release --locked --target ${{ matrix.target }}
      - name: Pack (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/pack
          tar -C "target/${{ matrix.target }}/release" -czf \
            "target/pack/token-balance-${{ matrix.target }}.tar.gz" \
            token-balance tb
      - name: Pack (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/pack | Out-Null
          Compress-Archive -Path @(
            "target/${{ matrix.target }}/release/token-balance.exe",
            "target/${{ matrix.target }}/release/tb.exe"
          ) -DestinationPath "target/pack/token-balance-${{ matrix.target }}.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: token-balance-${{ matrix.target }}
          path: target/pack/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: bash tooling/install/tag-matches-version.sh "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum token-balance-* > sha256sums.txt
          ls -l
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
